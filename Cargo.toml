[workspace]
resolver = "3"
members = ["crates/orbit-model", "crates/orbit-agent", "crates/orbit-cli", "crates/orbit-tools", "crates/orbit-store"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
anyhow = "1.0.100"
crossterm = { version = "0.29.0", features = ["event-stream"] }
clap = { version = "4.5.48", features = ["derive", "env"] }
serde = { version = "1.0.229", features = ["derive"] }
toml = "0.9.8"
unicode-width = "0.2.2"
unicode-segmentation = "1.13.3"
async-stream = "0.3.6"
futures-core = "0.3.31"
futures-util = "0.3.31"
ratatui = { version = "0.30.2", features = ["unstable-rendered-line-info"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "stream"] }
serde_json = "1.0.151"
thiserror = "2.0.17"
tokio = { version = "1.53.1", features = ["macros", "net", "rt-multi-thread", "time", "process", "io-util"] }
tokio-util = { version = "0.7.19", features = ["rt"] }

[profile.release]
codegen-units = 1
lto = "thin"

# TUI development runs use the debug binary; keep regex parsing responsive there too.
[profile.dev.package.syntect]
opt-level = 3

[profile.dev.package.fancy-regex]
opt-level = 3

[profile.dev.package.regex-automata]
opt-level = 3

[profile.dev.package.regex-syntax]
opt-level = 3
