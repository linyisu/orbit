[workspace]
resolver = "3"
members = [
    "crates/orbit-model",
    "crates/orbit-agent",
    "crates/orbit-runtime",
    "crates/orbit-cli",
    "crates/orbit-tools",
]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
anyhow = "1.0.100"
clap = { version = "4.5.48", features = ["derive", "env"] }
globset = "0.4.18"
ignore = "0.4.33"
regex = "1.13.1"
rustix = { version = "1.1.4", features = ["fs"] }
serde = { version = "1.0.229", features = ["derive"] }
tempfile = "3.27.0"
toml = "0.9.8"
async-stream = "0.3.6"
futures-core = "0.3.31"
futures-util = "0.3.31"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "stream"] }
serde_json = "1.0.151"
thiserror = "2.0.17"
tokio = { version = "1.53.1", features = ["macros", "net", "rt-multi-thread", "time"] }
tokio-util = { version = "0.7.19", features = ["rt"] }

[profile.release]
codegen-units = 1
lto = "thin"
