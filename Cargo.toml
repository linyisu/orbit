[workspace]
resolver = "3"
members = [
    "crates/orbit-auth",
    "crates/orbit-model",
    "crates/orbit-agent",
    "crates/orbit-runtime",
    "crates/orbit-cli",
    "crates/orbit-tools",
    "crates/orbit-store",
]
exclude = ["vendor/ratex-unicode-font"]

[patch.crates-io]
ratex-unicode-font = { path = "vendor/ratex-unicode-font" }

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
# Internal workspace crates
orbit-agent = { path = "crates/orbit-agent" }
orbit-auth = { path = "crates/orbit-auth" }
orbit-model = { path = "crates/orbit-model" }
orbit-runtime = { path = "crates/orbit-runtime" }
orbit-store = { path = "crates/orbit-store" }
orbit-tools = { path = "crates/orbit-tools" }

# Third-party dependencies
anydoc = "0.1.9"
anyhow = "1.0.100"
arboard = { version = "3.6.1", features = ["wayland-data-control"] }
async-stream = "0.3.6"
base64 = "0.22.1"
clap = { version = "4.5.48", features = ["derive", "env"] }
crossterm = { version = "0.29.0", features = ["event-stream"] }
cssparser = { version = "0.37.0", default-features = false }
encoding_rs = "0.8.35"
futures-core = "0.3.31"
futures-util = "0.3.31"
getrandom = "0.4.3"
globset = "0.4.18"
html2text = "0.17.1"
html5ever = "0.39.0"
httpdate = "1.0.3"
hyper-util = { version = "0.1.20", features = ["client-proxy"] }
ignore = "0.4.33"
image = { version = "0.25.9", default-features = false, features = ["gif", "jpeg", "png", "webp"] }
libc = "0.2.189"
pulldown-cmark = { version = "0.13.4", default-features = false }
ratatui = { version = "0.30.2", features = ["unstable-rendered-line-info"] }
ratatui-image = { version = "11.1.0", default-features = false, features = ["crossterm"] }
ratex-layout = "0.1.14"
ratex-parser = "0.1.14"
ratex-svg = { version = "0.1.14", features = ["standalone", "embed-fonts"] }
ratex-types = "0.1.14"
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "stream", "socks"] }
resvg = { version = "0.46.0", default-features = false, features = ["text", "system-fonts", "raster-images"] }
rusqlite = { version = "0.39.0", features = ["bundled"] }
rustix = { version = "1.1.4", features = ["fs"] }
seccompiler = "0.5.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
shlex = "1.3.0"
similar = "2.7.0"
syntect = { version = "5.3.0", default-features = false, features = ["default-fancy"] }
tempfile = "3.27.0"
thiserror = "2.0.17"
tokei = { version = "15.0.0", default-features = false }
tokio = { version = "1.53.1", features = ["macros", "net", "rt-multi-thread", "time", "process", "io-util", "io-std", "signal", "fs"] }
tokio-tungstenite = "0.28.0"
tokio-util = { version = "0.7.19", features = ["rt"] }
toml = "0.9.8"
toml_edit = "0.23.7"
tree-sitter = "0.25"
tree-sitter-go = "0.23"
tree-sitter-javascript = "0.23"
tree-sitter-python = "0.23"
tree-sitter-rust = "0.24"
tree-sitter-typescript = "0.23"
two-face = { version = "0.5.2", default-features = false, features = ["syntect-fancy"] }
unicode-linebreak = "0.1.5"
unicode-segmentation = "1.13.3"
unicode-width = "0.2.2"
url = "2.5"
windows-sys = { version = "0.61.2", features = ["Win32_Storage_FileSystem", "Win32_Foundation"] }

[profile.release]
codegen-units = 1
lto = "thin"

# TUI development runs use the debug binary; keep regex parsing responsive there too.
[profile.dev.package.syntect]
opt-level = 3

[profile.dev.package.fancy-regex]
opt-level = 3

[profile.dev.package.regex-automata]
opt-level = 3

[profile.dev.package.regex-syntax]
opt-level = 3
