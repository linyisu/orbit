[workspace]
resolver = "3"
members = [
    "crates/orbit-model",
    "crates/orbit-agent",
    "crates/orbit-runtime",
    "crates/orbit-store",
    "crates/orbit-cli",
    "crates/orbit-tools",
]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
anydoc = "0.1.9"
anyhow = "1.0.100"
base64 = "0.22.1"
clap = { version = "4.5.48", features = ["derive", "env"] }
crossterm = { version = "0.29.0", features = ["event-stream"] }
globset = "0.4.18"
html2text = "0.17.1"
image = { version = "0.25.9", default-features = false, features = ["gif", "jpeg", "png", "webp"] }
ignore = "0.4.33"
regex = "1.13.1"
roxmltree = "0.21.1"
rustix = { version = "1.1.4", features = ["fs"] }
rusqlite = { version = "0.39.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
tempfile = "3.27.0"
toml = "0.9.8"
url = "2.5"
async-stream = "0.3.6"
futures-core = "0.3.31"
futures-util = "0.3.31"
ratatui = "0.30.2"
pulldown-cmark = { version = "0.13.4", default-features = false }
unicode-segmentation = "1.13.3"
unicode-width = "0.2.2"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "stream"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
thiserror = "2.0.17"
tokio = { version = "1.53.1", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
tokio-util = { version = "0.7.19", features = ["rt"] }

[profile.release]
codegen-units = 1
lto = "thin"
