# Copy this file to config.toml and replace both API keys as needed.
# The initial TUI model is the default model of this provider.
default_provider = "openai"

# Default context window, including output reserve; a model-level value overrides it.
context_tokens = 128000
# Automatically summarize older context near 85% of the available input budget.
# Uses additional model requests; original conversation records remain stored.
auto_compact = true
# Per-request output limit; reasoning can consume this budget too.
max_output_tokens = 32000
# Per user request. Set either to 0 only when an unlimited loop is intentional.
max_turns = 75
max_tool_calls = 500

[providers.openai]
api_format = "openai_responses"
base_url = "https://api.openai.com/v1"
api_key = "replace-with-openai-key"
timeout_seconds = 600
# Retry transient connection, timeout, and retryable HTTP failures before
# streaming begins. Once response headers arrive, Orbit never replays it.
max_retries = 2

[[providers.openai.models]]
id = "gpt-5.6-sol"
context_tokens = 128000
reasoning = { adapter = "openai_responses", efforts = ["minimal", "low", "medium", "high", "xhigh"], default = "high" }

[[providers.openai.models]]
id = "gpt-6-astra"
context_tokens = 128000
reasoning = { adapter = "openai_responses", efforts = ["minimal", "low", "medium", "high", "xhigh"], default = "high" }

[providers.deepseek]
api_format = "anthropic_messages"
base_url = "https://api.deepseek.com/anthropic"
api_key = "replace-with-deepseek-key"
timeout_seconds = 600
max_retries = 2

[[providers.deepseek.models]]
id = "deepseek-flash"
context_tokens = 128000
reasoning = { adapter = "anthropic_messages", efforts = ["minimal", "low", "medium", "high", "xhigh"], default = "high", extra = { thinking = { type = "enabled" } } }

[[providers.deepseek.models]]
id = "deepseek-pro"
context_tokens = 128000
reasoning = { adapter = "anthropic_messages", efforts = ["minimal", "low", "medium", "high", "xhigh"], default = "high", extra = { thinking = { type = "enabled" } } }

[command]
default_timeout_seconds = 120
max_timeout_seconds = 600
snapshot_mib = 64
snapshot_entries = 10000
writable_snapshot_mib = 256
dependency_caches = []
verification_commands = {}

# Optional trusted HTTP(S) proxy for web_fetch only. Never set by the model.
# The proxy resolves destination domains and must enforce its own egress policy.
# Omit for strict direct connections; environment proxies are not used implicitly.
[web]
# proxy = "http://127.0.0.1:7897"

# MCP server configuration follows the local stdio shape commonly used by
# Claude Code and Claude Desktop. Orbit never reads a repository .mcp.json on
# its own: configuring a process here is an explicit user authorization.
#
# [mcp.servers.files]
# enabled = true # Explicit opt-in; omitted servers do not start.
# command = "npx"
# args = ["-y", "@modelcontextprotocol/server-filesystem", "/tmp"]
# timeout_seconds = 120
# # Empty means every advertised server tool. Set a list to expose only these.
# tools = ["read_file", "list_directory"]
# # The server receives a clean environment. Pass only variables it needs.
# # env = { API_TOKEN = "replace-with-token" }
