# 连接与可用模型在 [providers.<名称>] 中配置。
# 首次启动时手动选择模型；客户端记住上次选择，恢复会话沿用会话自身的模型。

# 可选：任务轮数与工具调用上限（默认不限轮数、2000 次工具调用；设为 0 表示不限制）
# max_turns = 0
# max_tool_calls = 0

# 对新建或重新打开的会话收紧能力；与调用方原有的会话限制合并。
# 可选能力：all、subagents、web、mcp、skills、image、document、files、write、
# capability、command、history、project_state。all 禁用全部可选工具。
# disabled_capabilities = ["web", "mcp"]
# 完整工具名精确匹配；MCP 工具名称为 MCP_服务器_工具。
# disabled_tools = ["ReadFile", "MCP_Files_ReadFile"]

# 输入光标默认使用短拖尾；也可关闭并使用终端自身的光标动画。
# [tui]
# cursor_trail = false

# 网页、搜索与网络图片自动沿用 HTTP_PROXY / HTTPS_PROXY / ALL_PROXY，遵守 NO_PROXY。
# 通常无需额外配置。仅在需要覆盖环境代理时启用下方配置（端口按实际设置）。
# [web]
# proxy = "http://127.0.0.1:7897"
# allowed_origins = ["http://docs.internal:8080", "http://127.0.0.1:3000"]
# 搜索默认使用 Parallel → Exa → DuckDuckGo；匿名额度受提供商限制，无需浏览器或 API Key。
# search_providers = ["parallel", "exa", "duckduckgo"]

# 子 Agent：explore/review 只读；develop 默认使用独立 Git worktree，继承父会话审批。
[subagents]
max_concurrent = 8 # 同一父会话的并行上限，可设为 1..128
max_turns = 0 # 不限制轮数
max_tool_calls = 2000 # 0 表示不限
timeout_seconds = 1800 # 进度提醒间隔；提醒父代理先查看或沟通，再决定继续/终止，0 关闭提醒
# enabled = false
# explore_model = "deepseek::deepseek-chat" # 不设置时继承父模型与思考档位
# review_model = "openai::gpt-5.6-sol"

# --- 供应商配置示例 ---
# models 使用有序 ID 列表，或设为 "auto" 跟随服务端目录。
# 容量与能力自动发现；model_overrides 仅填写希望覆盖的字段。
# /model refresh 或模型选择器中的 F5 同时更新账号目录与公共规格，不改写配置。

# 示例 1：DeepSeek (API Key 认证)
[providers.deepseek]
models = ["deepseek-chat", "deepseek-reasoner"]
api_format = "openai_chat_completions" # 可选: openai_chat_completions, openai_responses, anthropic_messages
base_url = "https://api.deepseek.com/v1"
api_key = "replace-with-deepseek-key"  # 也可用 credential = "凭据名" 引用 /connect 保存的凭据

[providers.deepseek.model_overrides]
deepseek-reasoner = { reasoning = { efforts = ["high"], default = "high" } }

# 示例 2：OpenAI Responses
[providers.openai]
models = ["gpt-5.6-sol"]
api_format = "openai_responses"
base_url = "https://api.openai.com/v1"
api_key = "replace-with-openai-key"

[providers.openai.model_overrides]
"gpt-5.6-sol" = { supports_vision = true, reasoning = { efforts = ["none", "low", "medium", "high"], default = "high" } }

[command]
# 命令直接使用目标用户环境，在会话真实工作目录执行。
network = "allow" # 允许声明联网；仅用于审批，不限制原生进程网络
read_file_scan_bytes = 67108864 # 每次文件读取最多扫描 64 MiB；0 表示不限扫描量

[permissions]
# 用户明确确认这些文件是可公开的模板后，填写工作区内的精确路径。
# 读取与写入分别授权；write_templates 同时允许读取。不会按文件后缀自动信任。
read_templates = [] # 例如 [".env.example"]
write_templates = []
