# 默认供应商（对应下方 [providers.<名称>]）
default_provider = "deepseek"

# 可选：任务轮数与工具调用上限（默认不限轮数、2000 次工具调用；设为 0 表示不限制）
# max_turns = 0
# max_tool_calls = 0

# 输入光标默认使用短拖尾；也可关闭并使用终端自身的光标动画。
# [tui]
# cursor_trail = false

# 网页、搜索与网络图片自动沿用 HTTP_PROXY / HTTPS_PROXY / ALL_PROXY，遵守 NO_PROXY。
# 通常无需额外配置。仅在需要覆盖环境代理时启用下方配置（端口按实际设置）。
# [web]
# proxy = "http://127.0.0.1:7897"
# allowed_origins = ["http://docs.internal:8080", "http://127.0.0.1:3000"]

# 子 Agent：explore/review 只读；develop 默认使用独立 Git worktree，继承父会话审批。
[subagents]
max_concurrent = 8 # 同一父会话的并行上限，可设为 1..128
max_turns = 0 # 不限制轮数
max_tool_calls = 2000 # 0 表示不限
timeout_seconds = 1800 # 进度提醒间隔；提醒父代理先查看或沟通，再决定继续/终止，0 关闭提醒
# enabled = false
# explore_model = "deepseek::deepseek-chat" # 不设置时继承父模型与思考档位
# review_model = "openai::gpt-5.6-sol"

# --- 供应商配置示例 ---

# 示例 1：DeepSeek (API Key 认证)
[providers.deepseek]
api_format = "openai_chat_completions" # 可选: openai_chat_completions, openai_responses, anthropic_messages
base_url = "https://api.deepseek.com/v1"
api_key = "replace-with-deepseek-key"  # 也可用 credential = "凭据名" 引用 orbit auth 保存的凭据

[[providers.deepseek.models]]
id = "deepseek-chat"

[[providers.deepseek.models]]
id = "deepseek-reasoner"
reasoning = { adapter = "openai_chat", efforts = ["high"], default = "high" }

# 示例 2：OpenAI (支持多模态视觉输入与思考强度调节)
[providers.openai]
api_format = "openai_responses"
base_url = "https://api.openai.com/v1"
api_key = "replace-with-openai-key"

[[providers.openai.models]]
id = "gpt-5.6-sol"
supports_vision = true
reasoning = { adapter = "openai_responses", efforts = ["none", "low", "medium", "high"], default = "high" }

# --- 命令与交付预算 ---
[command]
# Enable OS isolation for commands and helper processes.
sandbox = false
network = "allow" # 允许显式申请联网；run_command 单次请求默认 network="deny"
read_file_scan_bytes = 67108864 # 每次文件读取最多扫描 64 MiB；0 表示不限扫描量

[command.process_limits]
max_tmp_bytes = 2147483648 # 每次命令 /tmp 的总配额 2 GiB；0 使用不限额的磁盘临时目录

[command.artifacts]
max_file_bytes = 1073741824 # 1 GiB；0 表示不限
max_session_bytes = 4294967296 # 4 GiB；0 表示不限
max_files = 128 # 0 表示不限

[permissions]
# 用户明确确认这些文件是可公开的模板后，填写工作区内的精确路径。
# 读取与写入分别授权；write_templates 同时允许读取。不会按文件后缀自动信任。
read_templates = [] # 例如 [".env.example"]
write_templates = []
