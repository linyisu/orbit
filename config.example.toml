# Copy this file to config.toml and replace both API keys as needed.
# The initial TUI model is the default model of this provider.
default_provider = "openai"

[providers.openai]
api_format = "openai_responses"
base_url = "https://api.openai.com/v1"
api_key = "replace-with-openai-key"
timeout_seconds = 600

[[providers.openai.models]]
id = "gpt-5.6-sol"
reasoning = { adapter = "openai_responses", efforts = ["minimal", "low", "medium", "high", "xhigh"], default = "high" }

[[providers.openai.models]]
id = "gpt-6-astra"
reasoning = { adapter = "openai_responses", efforts = ["minimal", "low", "medium", "high", "xhigh"], default = "high" }

[providers.deepseek]
api_format = "anthropic_messages"
base_url = "https://api.deepseek.com/anthropic"
api_key = "replace-with-deepseek-key"
timeout_seconds = 600

[[providers.deepseek.models]]
id = "deepseek-flash"
reasoning = { adapter = "anthropic_messages", efforts = ["minimal", "low", "medium", "high", "xhigh"], default = "high", extra = { thinking = { type = "enabled" } } }

[[providers.deepseek.models]]
id = "deepseek-pro"
reasoning = { adapter = "anthropic_messages", efforts = ["minimal", "low", "medium", "high", "xhigh"], default = "high", extra = { thinking = { type = "enabled" } } }

# Approximate context budget including output reserve, not provider billing tokens.
context_tokens = 128000
# Automatically summarize older context near 85% of the available input budget.
# Uses additional model requests; original conversation records remain stored.
auto_compact = true

# Per-request output limit; reasoning can consume this budget too.
max_output_tokens = 32000

# Per user request. Zero means unlimited; cancellation remains available.
max_turns = 0
max_tool_calls = 0

# Override the generic token budgets for your provider/model, e.g. current
# DeepSeek Flash: context_tokens = 1000000, max_output_tokens = 64000.
# Keep these token settings above [command] (they are top-level settings).

[command]
default_timeout_seconds = 120
max_timeout_seconds = 600

# Optional trusted HTTP(S) proxy for web_fetch only. Never set by the model.
# The proxy resolves destination domains and must enforce its own egress policy.
# Omit for strict direct connections; environment proxies are not used implicitly.
[web]
# proxy = "http://127.0.0.1:7897"
