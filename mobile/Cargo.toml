[package]
name = "orbit-mobile-probe"
version = "0.1.0"
edition = "2024"
publish = false

# Keep the platform experiment out of the desktop dependency resolution.
[workspace]

[lib]
name = "orbit_mobile_probe"
crate-type = ["cdylib", "rlib"]

[dependencies]
gpui-kit = { git = "https://github.com/linyisu/gpui-kit", rev = "d7b441dbc0f6dac2cdea76d9df5eb44ffb13f4e4", default-features = false, features = ["component", "assets"] }

[target.'cfg(target_os = "android")'.dependencies]
gpui-mobile = { package = "gpui-pre-mobile", git = "https://github.com/longbridge/gpui-mobile", rev = "c24a1308e1dcb47ce94d9ef8d8d05ca4d77d2aa7", default-features = false, features = ["clipboard"] }
android-activity = { version = "0.6", features = ["native-activity"] }
android_logger = "0.15"
log = "0.4"

[patch.crates-io]
gpui-pre-wgpu = { git = "https://github.com/longbridge/gpui-mobile", rev = "c24a1308e1dcb47ce94d9ef8d8d05ca4d77d2aa7" }
gpui-pre-windows = { git = "https://github.com/linyisu/gpui-kit", rev = "d7b441dbc0f6dac2cdea76d9df5eb44ffb13f4e4" }

[profile.release]
strip = true
lto = "thin"

[features]
preview = []

[[bin]]
name = "orbit-mobile-preview"
path = "src/main.rs"
required-features = ["preview"]
