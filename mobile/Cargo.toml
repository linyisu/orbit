[package]
name = "orbit-mobile"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[lib]
crate-type = ["rlib"]

[dependencies]
orbit-client = { path = "../crates/orbit-client", default-features = false, features = ["remote"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
rqrr = "0.10"
base64 = "0.22"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "sync", "time"] }
nsh-core = { git = "https://github.com/longbridge/nsh", rev = "d5839d7a302e2061d54c58090588f0f953e366d0" }
nsh-base = { git = "https://github.com/longbridge/nsh", rev = "d5839d7a302e2061d54c58090588f0f953e366d0", default-features = false, features = ["highlight"] }

[dev-dependencies]
qrcode = { version = "0.14", default-features = false, features = ["image"] }
orbit-protocol = { path = "../crates/orbit-protocol" }
rcgen = "0.14"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
nsh-testing = { git = "https://github.com/longbridge/nsh", rev = "d5839d7a302e2061d54c58090588f0f953e366d0", default-features = false }
nsh-engine = { git = "https://github.com/longbridge/nsh", rev = "d5839d7a302e2061d54c58090588f0f953e366d0", default-features = false }

[profile.release]
strip = true
lto = "thin"

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
ndk-sys = { version = "0.6", features = ["media"] }
