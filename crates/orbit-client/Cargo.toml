[package]
name = "orbit-client"
version.workspace = true
edition.workspace = true

[[example]]
name = "orbit-client-test-peer"
path = "tests/support/session_peer.rs"

[features]
test-support = []
local-speech = ["dep:qwen-asr", "dep:reqwest"]

[dependencies]
similar.workspace = true
chrono.workspace = true
url.workspace = true
orbit-config.workspace = true
anyhow.workspace = true
globset.workspace = true
base64.workspace = true
libc.workspace = true
orbit-agent.workspace = true
orbit-model.workspace = true
orbit-auth.workspace = true
orbit-tools.workspace = true
orbit-runtime.workspace = true
orbit-protocol.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
shlex.workspace = true
tempfile.workspace = true
tokio.workspace = true
tokio-util.workspace = true
toml.workspace = true
qwen-asr = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }

[dev-dependencies]
orbit-build = { workspace = true, features = ["test-support"] }
orbit-config = { workspace = true, features = ["test-support"] }

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
qwen-asr = { workspace = true, optional = true, features = ["blas"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
