[package]
name = "orbit-gui"
version.workspace = true
edition.workspace = true
default-run = "orbit-gui"

[features]
test-support = []

[[bin]]
name = "orbit-gui-fixture"
path = "tests/support/server.rs"
required-features = ["test-support"]
test = false
bench = false

[[test]]
name = "transport"
required-features = ["test-support"]

[dependencies]
anyhow.workspace = true
arboard.workspace = true
base64.workspace = true
image.workspace = true
clap.workspace = true
chrono.workspace = true
orbit-client.workspace = true
orbit-auth.workspace = true
orbit-config.workspace = true
orbit-agent.workspace = true
orbit-model.workspace = true
orbit-protocol.workspace = true
orbit-tools.workspace = true
orbit-runtime.workspace = true
orbit-syntax.workspace = true
syntect.workspace = true
serde_json.workspace = true
serde.workspace = true
similar.workspace = true
ratex-layout.workspace = true
ratex-parser.workspace = true
ratex-svg.workspace = true
ratex-types.workspace = true
resvg.workspace = true
reqwest.workspace = true
pulldown-cmark.workspace = true
tempfile.workspace = true
tokio.workspace = true
url.workspace = true
gpui-kit = { git = "https://github.com/linyisu/gpui-component", rev = "f2e0656f9883dd203304014fe9e4568e18a3e51b", features = [
    "tree-sitter-bash", "tree-sitter-c", "tree-sitter-cpp", "tree-sitter-css",
    "tree-sitter-go", "tree-sitter-html", "tree-sitter-javascript", "tree-sitter-lua",
    "tree-sitter-python", "tree-sitter-rust", "tree-sitter-toml",
    "tree-sitter-tsx", "tree-sitter-typescript", "tree-sitter-yaml",
] }
gpui-shell = { git = "https://github.com/linyisu/gpui-component", rev = "f2e0656f9883dd203304014fe9e4568e18a3e51b" }
gpui-component-shell = { git = "https://github.com/linyisu/gpui-component", rev = "f2e0656f9883dd203304014fe9e4568e18a3e51b" }

[build-dependencies]
orbit-build.workspace = true
