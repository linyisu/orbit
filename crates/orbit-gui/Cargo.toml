[package]
name = "orbit-gui"
version.workspace = true
edition.workspace = true
default-run = "orbit-gui"

[features]
test-support = ["orbit-client/test-support"]

[[bin]]
name = "orbit-gui-fixture"
path = "tests/support/server.rs"
required-features = ["test-support"]
test = false
bench = false

[[test]]
name = "transport"
required-features = ["test-support"]

[dependencies]
anyhow.workspace = true
arboard.workspace = true
base64.workspace = true
image.workspace = true
clap.workspace = true
chrono.workspace = true
orbit-client.workspace = true
orbit-config.workspace = true
orbit-protocol.workspace = true
orbit-syntax.workspace = true
syntect.workspace = true
serde_json.workspace = true
serde.workspace = true
similar.workspace = true
ratex-layout.workspace = true
ratex-parser.workspace = true
ratex-svg.workspace = true
ratex-types.workspace = true
resvg.workspace = true
pulldown-cmark.workspace = true
tempfile.workspace = true
tokio.workspace = true
url.workspace = true
gpui-kit = { git = "https://github.com/linyisu/gpui-kit", rev = "9c39eb67c57677a9f495132415af30934a2176da", features = [
    "tree-sitter-bash", "tree-sitter-c", "tree-sitter-cpp", "tree-sitter-css",
    "tree-sitter-go", "tree-sitter-html", "tree-sitter-javascript", "tree-sitter-lua",
    "tree-sitter-python", "tree-sitter-rust", "tree-sitter-toml",
    "tree-sitter-tsx", "tree-sitter-typescript", "tree-sitter-yaml",
] }
gpui-shell = { git = "https://github.com/linyisu/gpui-kit", rev = "9c39eb67c57677a9f495132415af30934a2176da", default-features = false, features = ["quickjs", "components"] }

[build-dependencies]
orbit-build.workspace = true
