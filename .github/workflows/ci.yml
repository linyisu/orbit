name: CI

on:
  push:
    branches: ["main", "dev"]
  pull_request:
    branches: ["main", "dev"]

env:
  CARGO_TERM_COLOR: always

jobs:
  ci:
    name: CI Check & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap musl-tools

      - name: Enable unprivileged user namespaces
        run: |
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          if [ -e /proc/sys/kernel/unprivileged_userns_clone ]; then
            sudo sysctl -w kernel.unprivileged_userns_clone=1
          fi

      - name: Verify Bubblewrap
        run: |
          bwrap --version
          args=(
            --unshare-user
            --disable-userns
            --die-with-parent
            --new-session
            --cap-drop ALL
            --unshare-pid
            --unshare-ipc
            --unshare-uts
            --unshare-cgroup-try
          )
          for path in /usr /bin /sbin /lib /lib64; do
            if [ -e "$path" ]; then
              args+=(--ro-bind "$path" "$path")
            fi
          done
          if [ -e /etc/ld.so.cache ]; then
            args+=(--ro-bind /etc/ld.so.cache /etc/ld.so.cache)
          fi
          bwrap "${args[@]}" /usr/bin/true

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: x86_64-unknown-linux-musl

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Check architecture
        run: python3 scripts/check-architecture.py

      - name: Test CI scripts
        run: python3 -B -m unittest discover -s scripts -p 'test_*.py'

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --workspace

  native-execution:
    name: Execution without Bubblewrap
    runs-on: ubuntu-latest
    env:
      ORBIT_TEST_REQUIRE_NO_SANDBOX: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Prepare host without sandbox dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
          sudo apt-get remove -y bubblewrap
          test ! -e /usr/bin/bwrap
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
      - name: Verify native execution and explicit sandbox failure
        run: cargo test -p orbit-cli --test workspace_service native_execution

  linux-bundle:
    name: Portable Linux bundle
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install bundle test dependencies
        run: sudo apt-get update && sudo apt-get install -y musl-tools ca-certificates
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
      - name: Build client with embedded portable server
        run: scripts/build-bundle.sh
      - name: Verify standalone client on older Linux
        run: python3 scripts/test-remote-bundle.py target/bundle
      - name: Package executable with permissions
        run: tar -czf target/orbit-linux-x86_64.tar.gz -C target/bundle orbit orbit-cli
      - uses: actions/upload-artifact@v4
        with:
          name: orbit-linux-x86_64
          path: target/orbit-linux-x86_64.tar.gz
