name: CI

on:
  push:
    branches: ["main", "dev"]
  pull_request:
    branches: ["main", "dev"]

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: "2"
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  ci:
    name: CI Check & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools build-essential

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: x86_64-unknown-linux-musl

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Check architecture
        run: cargo xtask check

      - name: Test repository tooling
        run: cargo test -p orbit-xtask

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --workspace

      - name: Report build resources on failure
        if: failure()
        run: |
          df -h
          free -h
          du -sh target/* 2>/dev/null || true

  linux-bundle:
    name: Portable Linux bundle
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install bundle test dependencies
        run: sudo apt-get update && sudo apt-get install -y musl-tools ca-certificates
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
      - name: Build client with embedded portable server
        run: cargo xtask bundle
      - name: Verify standalone client on older Linux
        run: cargo xtask verify-bundle target/bundle
      - name: Package executable with permissions
        run: cargo xtask archive target/bundle target/orbit-linux-x86_64.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: orbit-linux-x86_64
          path: target/orbit-linux-x86_64.tar.gz
