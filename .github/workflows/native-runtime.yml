name: Native runtime contracts

on:
  workflow_dispatch:
  push:
    branches: [main, native-runtime-foundation]
    paths:
      - 'crates/orbit-agent/**'
      - 'crates/orbit-model/**'
      - 'crates/orbit-protocol/**'
      - 'crates/orbit-store/**'
      - 'crates/orbit-syntax/**'
      - 'crates/orbit-runtime/**'
      - 'crates/orbit-service/**'
      - 'crates/orbit-client/**'
      - 'crates/orbit-build/**'
      - 'crates/orbit-xtask/**'
      - 'crates/orbit-tools/**'
      - 'crates/orbit-auth/**'
      - 'crates/orbit-config/**'
      - '.github/workflows/native-runtime.yml'
      - 'Cargo.toml'
      - 'Cargo.lock'
  pull_request:
    paths:
      - 'crates/orbit-agent/**'
      - 'crates/orbit-model/**'
      - 'crates/orbit-protocol/**'
      - 'crates/orbit-store/**'
      - 'crates/orbit-syntax/**'
      - 'crates/orbit-runtime/**'
      - 'crates/orbit-service/**'
      - 'crates/orbit-client/**'
      - 'crates/orbit-build/**'
      - 'crates/orbit-xtask/**'
      - 'crates/orbit-tools/**'
      - 'crates/orbit-auth/**'
      - 'crates/orbit-config/**'
      - '.github/workflows/native-runtime.yml'
      - 'Cargo.toml'
      - 'Cargo.lock'

permissions:
  contents: read

concurrency:
  group: native-runtime-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repair-regressions:
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/native-runtime-foundation'
      && !contains(github.event.head_commit.message, '[native-full]')
      && !contains(github.event.head_commit.message, '[installer-only]')
    name: Repair regressions (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(contains(github.event.head_commit.message, '[test-only]') && '["windows-2025"]' || '["macos-26","windows-2025"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: native-repair-${{ matrix.os }}
          cache-targets: 'true'
          cache-on-failure: 'true'
      - name: Test native interpreter, output decoding and process ownership
        if: ${{ !contains(github.event.head_commit.message, '[test-only]') }}
        run: |
          cargo test -p orbit-runtime --lib --locked execution::shell_environment::tests
          cargo test -p orbit-runtime --lib --locked execution::output::encoding::tests
          cargo test -p orbit-runtime --lib --locked execution::process::tests
          cargo test -p orbit-runtime --test native_execution --locked
      - name: Test target context, path projection and retained log pagination
        if: ${{ !contains(github.event.head_commit.message, '[test-only]') }}
        run: |
          cargo test -p orbit-service --lib --locked context::instructions::tests
          cargo test -p orbit-client --lib --locked directories::display_tests
          cargo test -p orbit-client --lib --locked execution::details::request::tests
          cargo test -p orbit-tools --lib --locked read_command_output::tests
      - name: Retest the Windows private log fixture
        if: contains(github.event.head_commit.message, '[test-only]')
        run: cargo test -p orbit-tools --lib --locked read_command_output::tests::reads_a_bounded_page

  process-ownership:
    if: >-
      github.event_name != 'push' || github.ref != 'refs/heads/native-runtime-foundation'
      || contains(github.event.head_commit.message, '[native-full]')
    name: Process ownership (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, macos-26, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Test production process owner and descendant cleanup
        run: cargo test -p orbit-runtime --locked execution::process::tests
      - name: Check native runtime tests
        run: cargo clippy -p orbit-runtime --all-targets --locked -- -D warnings

  runtime:
    if: >-
      github.event_name != 'push' || github.ref != 'refs/heads/native-runtime-foundation'
      || contains(github.event.head_commit.message, '[native-full]')
    name: Runtime (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, macos-26, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Test complete native runtime
        run: cargo test -p orbit-runtime --locked

  macos-service:
    if: >-
      github.event_name != 'push' || github.ref != 'refs/heads/native-runtime-foundation'
      || contains(github.event.head_commit.message, '[native-full]')
    name: macOS service lifecycle
    runs-on: macos-26
    timeout-minutes: 45
    env:
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Test native service identity and handover
        run: cargo test -p orbit-service --locked workspace::server::lifecycle::tests
      - name: Test atomic writes and permission preservation
        run: cargo test -p orbit-tools --locked --test write_file
      - name: Test native Git inspection and index transactions
        run: cargo test -p orbit-tools --locked --test git_inspect --test git_index
      - name: Test portable file transactions
        run: cargo test -p orbit-tools --locked --test native_files

  windows-backend:
    if: >-
      github.event_name != 'push' || github.ref != 'refs/heads/native-runtime-foundation'
      || contains(github.event.head_commit.message, '[native-full]')
    name: Windows native backend
    runs-on: windows-2025
    timeout-minutes: 45
    env:
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Test production named pipes
        run: |
          cargo test -p orbit-runtime --locked ipc::
      - name: Test native executable cache
        run: cargo test -p orbit-client --locked local_server::tests
      - name: Test bridge pipe inheritance isolation
        run: cargo test -p orbit-service --locked --lib workspace::server::lifecycle::tests
      - name: Check complete native backend dependency graph
        run: cargo check -p orbit-server -p orbit-client --locked
      - name: Test native writes and Git index transactions
        if: ${{ !cancelled() }}
        run: cargo test -p orbit-tools --locked --test native_files
      - name: Test native extension packages
        if: ${{ !cancelled() }}
        run: cargo test -p orbit-service --locked --lib workspace::library::package::native_tests
      - name: Test native transferred configuration and retained output
        if: ${{ !cancelled() }}
        run: |
          cargo test -p orbit-service --locked --lib workspace::configuration::tests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test -p orbit-service --locked --lib workspace::tool_output::tests
      - name: Test native credential storage
        if: ${{ !cancelled() }}
        run: cargo test -p orbit-auth --locked --lib store::tests
      - name: Test native user directories
        if: ${{ !cancelled() }}
        run: cargo test -p orbit-config --locked directories::tests
      - name: Test native SSH prompt channels
        if: ${{ !cancelled() }}
        run: cargo test -p orbit-client --locked --lib interaction::tests

  native-bundle:
    if: >-
      github.event_name != 'push' || github.ref != 'refs/heads/native-runtime-foundation'
      || contains(github.event.head_commit.message, '[native-full]')
    name: Native bundle (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Test build and archive contracts
        run: cargo test -p orbit-build -p orbit-xtask --locked
      - name: Test native client editor launch adapter
        run: cargo test -p orbit-client --locked platform::editor::tests
      - name: Test native session controls during model refresh
        run: cargo test -p orbit-client --locked pump::session::tests
      - name: Test native MCP transport lifecycle
        run: cargo test -p orbit-tools --lib --locked mcp::tests
      - name: Build native terminal with embedded service
        run: cargo xtask bundle debug
      - name: Verify native deployment and protocol
        run: cargo xtask verify-native-bundle target/bundle
      - name: Archive standalone client
        run: cargo xtask archive target/bundle
