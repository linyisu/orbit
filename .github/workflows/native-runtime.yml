name: Native runtime contracts

on:
  workflow_dispatch:
  push:
    branches: [main, 'codex/native-runtime-*']
    paths:
      - 'crates/orbit-runtime/**'
      - 'crates/orbit-service/**'
      - 'crates/orbit-tools/**'
      - '.github/scripts/test-native-process.py'
      - '.github/workflows/native-runtime.yml'
      - 'Cargo.toml'
      - 'Cargo.lock'
  pull_request:
    paths:
      - 'crates/orbit-runtime/**'
      - 'crates/orbit-service/**'
      - 'crates/orbit-tools/**'
      - '.github/scripts/test-native-process.py'
      - '.github/workflows/native-runtime.yml'
      - 'Cargo.toml'
      - 'Cargo.lock'

permissions:
  contents: read

jobs:
  process-ownership:
    name: Process ownership (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test production process owner and descendant cleanup
        run: python .github/scripts/test-native-process.py

  runtime:
    name: Runtime (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Test complete native runtime
        run: cargo test -p orbit-runtime --locked

  macos-service:
    name: macOS service lifecycle
    runs-on: macos-15
    timeout-minutes: 30
    env:
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Test native service identity and handover
        run: cargo test -p orbit-service --locked workspace::server::lifecycle::tests
      - name: Test atomic writes and permission preservation
        run: cargo test -p orbit-tools --locked --test write_file
