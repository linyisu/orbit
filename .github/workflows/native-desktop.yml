name: Native desktop contracts

on:
  workflow_dispatch:
  push:
    branches: [main, native-runtime-foundation]
    paths:
      - 'crates/**'
      - 'vendor/qwen-asr/**'
      - 'vendor/gpui-pre-wgpu/**'
      - '.github/workflows/native-desktop.yml'
      - 'Cargo.toml'
      - 'Cargo.lock'
  pull_request:
    paths:
      - 'crates/**'
      - 'vendor/qwen-asr/**'
      - 'vendor/gpui-pre-wgpu/**'
      - '.github/workflows/native-desktop.yml'
      - 'Cargo.toml'
      - 'Cargo.lock'

permissions:
  contents: read
  actions: read

concurrency:
  group: native-desktop-${{ github.ref }}${{ contains(github.event.head_commit.message, '[installer-only]') && '-installer' || '' }}
  cancel-in-progress: true

jobs:
  desktop:
    name: Desktop (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: >-
          ${{ fromJSON(
            contains(github.event.head_commit.message, '[installer-only]')
            && '["windows-2025"]'
            ||
            github.event_name == 'push' && github.ref == 'refs/heads/native-runtime-foundation'
            && !contains(github.event.head_commit.message, '[native-full]')
            && '["windows-2025"]'
            || '["ubuntu-26.04","macos-26","windows-2025"]'
          ) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_INCREMENTAL: '0'
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@v7
      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools build-essential clang pkg-config \
            libfontconfig-dev libwayland-dev libxkbcommon-x11-dev libx11-xcb-dev \
            libssl-dev libzstd-dev libasound2-dev libvulkan-dev xvfb \
            mesa-vulkan-drivers fonts-noto-cjk fonts-noto-color-emoji
      - uses: dtolnay/rust-toolchain@stable
      - name: Install portable Linux service target
        if: runner.os == 'Linux'
        run: rustup target add x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}
          cache-targets: 'true'
          cache-on-failure: 'true'
      - name: Rebuild Linux speech libraries from complete sources
        if: runner.os == 'Linux'
        run: cargo clean -p openblas-src
      - name: Build native desktop package
        if: ${{ !contains(github.event.head_commit.message, '[installer-only]') }}
        run: cargo xtask bundle-gui debug
      - name: Select the latest existing Windows GUI for packaging retries
        if: contains(github.event.head_commit.message, '[installer-only]')
        id: previous-gui
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $run = gh api 'repos/${{ github.repository }}/actions/artifacts?name=orbit-desktop-windows-2025-X64&per_page=10' --jq '.artifacts | map(select(.expired == false)) | first | .workflow_run.id'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "run=$run" >> $env:GITHUB_OUTPUT
      - uses: actions/download-artifact@v8
        if: contains(github.event.head_commit.message, '[installer-only]')
        with:
          name: orbit-desktop-windows-2025-X64
          run-id: ${{ steps.previous-gui.outputs.run }}
          github-token: ${{ github.token }}
          path: target/previous-gui
      - name: Restore the existing GUI and build acceptance tooling
        if: contains(github.event.head_commit.message, '[installer-only]')
        run: |
          Expand-Archive target/previous-gui/orbit-desktop-windows-x86_64.zip target/bundle-gui -Force
          cargo build -p orbit-xtask --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test -p orbit-xtask --locked installer::tests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test -p orbit-xtask --locked remote::tests::installed_desktop_requires_a_single_extracted_server
      - name: Verify native window and embedded service
        if: runner.os == 'macOS'
        run: cargo xtask verify-gui-bundle
      - name: Verify Windows window and embedded service
        if: ${{ runner.os == 'Windows' && !contains(github.event.head_commit.message, '[installer-only]') }}
        timeout-minutes: 10
        run: .\target\debug\orbit-xtask.exe verify-gui-bundle
      - name: Verify isolated Linux window and embedded service
        if: runner.os == 'Linux'
        run: xvfb-run -a -s '-screen 0 1280x900x24' cargo xtask verify-gui-bundle
      - name: Test local speech and native model access
        if: ${{ !cancelled() && runner.os != 'Windows' }}
        run: |
          cargo test -p orbit-client --features local-speech --locked speech::
      - name: Test desktop preferences
        if: ${{ !cancelled() && runner.os != 'Windows' }}
        run: cargo test -p orbit-gui --locked --bin orbit-gui preferences::tests
      - name: Test Windows speech and preferences with packaged runtime flags
        if: >-
          ${{ !cancelled() && runner.os == 'Windows' && (
            github.event_name != 'push' || github.ref != 'refs/heads/native-runtime-foundation'
            || contains(github.event.head_commit.message, '[native-full]')
          ) }}
        run: |
          $nativeTarget = (rustc -vV | Select-String '^host: ').Line.Substring(6)
          $env:CARGO_ENCODED_RUSTFLAGS = "-C$([char]31)target-feature=+crt-static"
          cargo test -p orbit-client --features local-speech --locked --target "$nativeTarget" speech::
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test -p orbit-gui --locked --target "$nativeTarget" --bin orbit-gui preferences::tests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test native desktop archive contracts
        if: >-
          ${{ !cancelled() && (
            github.event_name != 'push' || github.ref != 'refs/heads/native-runtime-foundation'
            || contains(github.event.head_commit.message, '[native-full]')
          ) }}
        run: cargo test -p orbit-xtask --locked bundle::tests::desktop_archive
      - name: Archive desktop application
        if: ${{ !cancelled() }}
        run: cargo xtask archive-gui
      - name: Install Windows packaging tool
        if: runner.os == 'Windows'
        run: |
          New-Item -ItemType Directory -Force target/installer-tools | Out-Null
          curl.exe --fail --location --retry 4 --retry-all-errors --connect-timeout 20 --max-time 120 'https://downloads.sourceforge.net/project/nsis/NSIS%203/3.13/nsis-3.13.zip' --output target/installer-tools/nsis-3.13.zip
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $expected = 'ba63dffc4410ee89193e1cb5a41989991bd77c61068da17e3156d136b7b0b3d8'
          $actual = (Get-FileHash target/installer-tools/nsis-3.13.zip -Algorithm SHA256).Hash
          if ($actual -ne $expected) { throw 'NSIS archive SHA-256 mismatch' }
          Expand-Archive target/installer-tools/nsis-3.13.zip target/installer-tools -Force
          $nsis = Join-Path $env:GITHUB_WORKSPACE 'target/installer-tools/nsis-3.13'
          "NSISDIR=$nsis" >> $env:GITHUB_ENV
          $nsis >> $env:GITHUB_PATH
      - name: Build Windows Debug installer
        if: runner.os == 'Windows'
        run: .\target\debug\orbit-xtask.exe installer-gui target/bundle-gui target/orbit-gui-debug-windows-x64-setup.exe
      - uses: actions/upload-artifact@v7
        if: runner.os == 'Windows'
        with:
          name: orbit-windows-installer-acceptance
          path: target/debug/orbit-xtask.exe
      - uses: actions/upload-artifact@v7
        if: runner.os == 'Windows'
        with:
          name: orbit-gui-debug-windows-x64-installer
          path: target/orbit-gui-debug-windows-x64-setup.exe
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: orbit-desktop-${{ matrix.os }}-${{ runner.arch }}
          path: |
            target/orbit-desktop-*.tar.gz
            target/orbit-desktop-*.zip

  windows-installer:
    name: Windows clean-machine installer
    needs: desktop
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: orbit-gui-debug-windows-x64-installer
          path: package
      - uses: actions/download-artifact@v8
        with:
          name: orbit-windows-installer-acceptance
          path: acceptance
      - name: Install, render and uninstall without checkout or Cargo cache
        run: >-
          .\acceptance\orbit-xtask.exe verify-gui-installer
          package/orbit-gui-debug-windows-x64-setup.exe
