name: Native desktop contracts

on:
  workflow_dispatch:
  push:
    branches: [main, native-runtime-foundation]
    paths:
      - 'crates/**'
      - 'vendor/qwen-asr/**'
      - 'vendor/gpui-pre-wgpu/**'
      - '.github/workflows/native-desktop.yml'
      - 'Cargo.toml'
      - 'Cargo.lock'
  pull_request:
    paths:
      - 'crates/**'
      - 'vendor/qwen-asr/**'
      - 'vendor/gpui-pre-wgpu/**'
      - '.github/workflows/native-desktop.yml'
      - 'Cargo.toml'
      - 'Cargo.lock'

permissions:
  contents: read

concurrency:
  group: native-desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    name: Desktop (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-26.04, macos-15, macos-26, windows-2022, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_INCREMENTAL: '0'
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@v7
      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools build-essential clang pkg-config \
            libfontconfig-dev libwayland-dev libxkbcommon-x11-dev libx11-xcb-dev \
            libssl-dev libzstd-dev libasound2-dev libvulkan-dev xvfb \
            mesa-vulkan-drivers fonts-noto-cjk fonts-noto-color-emoji
      - uses: dtolnay/rust-toolchain@stable
      - name: Install portable Linux service target
        if: runner.os == 'Linux'
        run: rustup target add x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}
          cache-targets: 'true'
          cache-on-failure: 'true'
      - name: Rebuild Linux speech libraries from complete sources
        if: runner.os == 'Linux'
        run: cargo clean -p openblas-src
      - name: Build native desktop package
        run: cargo xtask bundle-gui debug
      - name: Verify native window and embedded service
        if: runner.os == 'macOS'
        run: cargo xtask verify-gui-bundle
      - name: Verify Windows window and embedded service
        if: runner.os == 'Windows'
        timeout-minutes: 10
        run: .\target\debug\orbit-xtask.exe verify-gui-bundle
      - name: Verify isolated Linux window and embedded service
        if: runner.os == 'Linux'
        run: xvfb-run -a -s '-screen 0 1280x900x24' cargo xtask verify-gui-bundle
      - name: Test local speech and native model access
        if: ${{ !cancelled() && runner.os != 'Windows' }}
        run: |
          cargo test -p orbit-client --features local-speech --locked speech::
      - name: Test desktop preferences
        if: ${{ !cancelled() && runner.os != 'Windows' }}
        run: cargo test -p orbit-gui --locked --bin orbit-gui preferences::tests
      - name: Test Windows speech and preferences with packaged runtime flags
        if: ${{ !cancelled() && runner.os == 'Windows' }}
        run: |
          $nativeTarget = (rustc -vV | Select-String '^host: ').Line.Substring(6)
          $env:CARGO_ENCODED_RUSTFLAGS = "-C$([char]31)target-feature=+crt-static"
          cargo test -p orbit-client --features local-speech --locked --target "$nativeTarget" speech::
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test -p orbit-gui --locked --target "$nativeTarget" --bin orbit-gui preferences::tests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test native desktop archive contracts
        if: ${{ !cancelled() }}
        run: cargo test -p orbit-xtask --locked bundle::tests::desktop_archive
      - name: Archive desktop application
        if: ${{ !cancelled() }}
        run: cargo xtask archive-gui
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: orbit-desktop-${{ matrix.os }}-${{ runner.arch }}
          path: |
            target/orbit-desktop-*.tar.gz
            target/orbit-desktop-*.zip
