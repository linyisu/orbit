name: Build

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: '2'
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'

jobs:
  remote-service:
    name: Linux service (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-26.04
            arch: x86_64
          - os: ubuntu-26.04-arm
            arch: aarch64
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.arch }}-unknown-linux-musl
      - name: Install the musl toolchain
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - uses: Swatinem/rust-cache@v2
        with:
          key: remote-musl-${{ matrix.arch }}
      - name: Build the matching SSH and WSL service
        run: cargo build -p orbit-server --bin orbit-workspace-server --release --target ${{ matrix.arch }}-unknown-linux-musl --locked
      - uses: actions/upload-artifact@v7
        with:
          name: remote-server-${{ matrix.arch }}
          path: target/${{ matrix.arch }}-unknown-linux-musl/release/orbit-workspace-server
          if-no-files-found: error
          retention-days: 7

  clients:
    name: ${{ matrix.platform }}
    needs: remote-service
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Linux
            os: ubuntu-26.04
            remote-arch: x86_64
          - platform: macOS
            os: macos-26
            remote-arch: aarch64
          - platform: Windows
            os: windows-2025
            remote-arch: x86_64
    steps:
      - uses: actions/checkout@v7
      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools build-essential clang pkg-config \
            libfontconfig-dev libwayland-dev libxkbcommon-x11-dev libx11-xcb-dev \
            libssl-dev libzstd-dev libasound2-dev libvulkan-dev xvfb \
            mesa-vulkan-drivers fonts-noto-cjk fonts-noto-color-emoji
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux service target
        if: runner.os == 'Linux'
        run: rustup target add x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
        with:
          key: build-${{ matrix.os }}
          cache-on-failure: 'true'
      - uses: actions/download-artifact@v8
        with:
          name: remote-server-${{ matrix.remote-arch }}
          path: target/remote-services
      - name: Select the matching embedded service
        shell: bash
        run: |
          echo "ORBIT_REMOTE_WORKSPACE_SERVER=$GITHUB_WORKSPACE/target/remote-services/orbit-workspace-server" >> "$GITHUB_ENV"
          if [[ "$RUNNER_OS" == Linux ]]; then
            chmod +x target/remote-services/orbit-workspace-server
            echo "ORBIT_WORKSPACE_SERVER=$GITHUB_WORKSPACE/target/remote-services/orbit-workspace-server" >> "$GITHUB_ENV"
          fi
      - name: Rebuild Linux speech libraries from complete sources
        if: runner.os == 'Linux'
        run: cargo clean -p openblas-src
      - name: Build the TUI Debug package
        run: cargo xtask bundle debug
      - name: Verify the TUI and embedded service
        run: cargo xtask verify-native-bundle target/bundle
      - name: Verify service deployment on older Linux
        if: runner.os == 'Linux'
        run: cargo xtask verify-bundle target/bundle
      - name: Archive the TUI
        run: cargo xtask archive target/bundle
      - name: Build the GUI Debug package
        run: cargo xtask bundle-gui debug
      - name: Verify the Linux window
        if: runner.os == 'Linux'
        run: xvfb-run -a -s '-screen 0 1280x900x24' cargo xtask verify-gui-bundle
      - name: Verify the macOS window
        if: runner.os == 'macOS'
        run: cargo xtask verify-gui-bundle
      - name: Verify the Windows window
        if: runner.os == 'Windows'
        timeout-minutes: 10
        run: .\target\debug\orbit-xtask.exe verify-gui-bundle
      - name: Archive the GUI
        run: cargo xtask archive-gui
      - name: Install Windows packaging tools
        if: runner.os == 'Windows'
        run: |
          New-Item -ItemType Directory -Force target/installer-tools | Out-Null
          curl.exe --fail --location --retry 4 --retry-all-errors --connect-timeout 20 --max-time 120 'https://downloads.sourceforge.net/project/nsis/NSIS%203/3.13/nsis-3.13.zip' --output target/installer-tools/nsis-3.13.zip
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $expected = 'ba63dffc4410ee89193e1cb5a41989991bd77c61068da17e3156d136b7b0b3d8'
          $actual = (Get-FileHash target/installer-tools/nsis-3.13.zip -Algorithm SHA256).Hash
          if ($actual -ne $expected) { throw 'NSIS archive SHA-256 mismatch' }
          Expand-Archive target/installer-tools/nsis-3.13.zip target/installer-tools -Force
          $nsis = Join-Path $env:GITHUB_WORKSPACE 'target/installer-tools/nsis-3.13'
          "NSISDIR=$nsis" >> $env:GITHUB_ENV
          $nsis >> $env:GITHUB_PATH
      - name: Build the Windows Debug installer
        if: runner.os == 'Windows'
        run: .\target\debug\orbit-xtask.exe installer-gui target/bundle-gui target/orbit-gui-debug-windows-x64-setup.exe
      - uses: actions/upload-artifact@v7
        with:
          name: orbit-tui-${{ matrix.platform }}-${{ runner.arch }}
          path: |
            target/orbit-linux-*.tar.gz
            target/orbit-macos-*.tar.gz
            target/orbit-windows-*.tar.gz
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: orbit-gui-${{ matrix.platform }}-${{ runner.arch }}
          path: |
            target/orbit-desktop-*.tar.gz
            target/orbit-desktop-*.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: runner.os == 'Windows'
        with:
          name: orbit-windows-installer-acceptance
          path: target/debug/orbit-xtask.exe
          if-no-files-found: error
          retention-days: 1
      - uses: actions/upload-artifact@v7
        if: runner.os == 'Windows'
        with:
          name: orbit-gui-debug-windows-x64-installer
          path: |
            target/orbit-gui-debug-windows-x64-setup.exe
            target/orbit-gui-debug-windows-x64-setup.exe.sha256
          if-no-files-found: error

  windows-installer:
    name: Windows installer verification
    needs: clients
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: orbit-gui-debug-windows-x64-installer
          path: package
      - uses: actions/download-artifact@v8
        with:
          name: orbit-windows-installer-acceptance
          path: acceptance
      - name: Install, run and uninstall without source or Cargo cache
        run: >-
          .\acceptance\orbit-xtask.exe verify-gui-installer
          package/orbit-gui-debug-windows-x64-setup.exe

  android:
    name: Android
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare Android toolchain
        run: |
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;30.0.16248370'
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/30.0.16248370" >> "$GITHUB_ENV"
      - name: Build pinned NSH tools
        run: |
          git clone https://github.com/longbridge/nsh "$RUNNER_TEMP/nsh"
          git -C "$RUNNER_TEMP/nsh" checkout d5839d7a302e2061d54c58090588f0f953e366d0
          git -C "$RUNNER_TEMP/nsh" apply "$GITHUB_WORKSPACE/mobile/patches/nsh-rust-runtime.patch"
          git -C "$RUNNER_TEMP/nsh" apply "$GITHUB_WORKSPACE/mobile/patches/nsh-android-activity.patch"
          git -C "$RUNNER_TEMP/nsh" apply "$GITHUB_WORKSPACE/mobile/patches/nsh-android-images.patch"
          git -C "$RUNNER_TEMP/nsh" apply "$GITHUB_WORKSPACE/mobile/patches/nsh-android-input.patch"
          cd "$RUNNER_TEMP/nsh"
          cargo build -p nsh-cli --locked
          cargo xtask android --abi arm64-v8a
      - name: Build Android package
        run: |
          "$RUNNER_TEMP/nsh/target/debug/nsh" package mobile --target android --out target/android-nsh
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -P 16 4 target/android-nsh/Orbit.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify target/android-nsh/Orbit.apk
      - uses: actions/upload-artifact@v7
        with:
          name: orbit-android-arm64
          path: target/android-nsh/Orbit.apk
          if-no-files-found: error
